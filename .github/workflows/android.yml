name: android

on:
  push:
    branches: ["**"]
    tags: ["app-v*"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: android

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  test:
    name: Unit tests + screenshots
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Unit tests (JVM + Robolectric)
        run: ./gradlew testDebugUnitTest --stacktrace

      # Reference images live in app/src/test/screenshots. Until they are
      # committed, record them (the artifact is the review copy); afterwards
      # verify against them.
      - name: Screenshots (Roborazzi)
        run: |
          if ls app/src/test/screenshots/*.png >/dev/null 2>&1; then
            ./gradlew :app:verifyRoborazziDebug --stacktrace
          else
            echo "::notice::No reference screenshots committed yet; recording."
            ./gradlew :app:recordRoborazziDebug --stacktrace
          fi

      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: |
            android/app/src/test/screenshots/
            android/app/build/outputs/roborazzi/
          if-no-files-found: warn

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: android/*/build/reports/tests/

  build:
    name: Build + manifest check
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      # The release build (unsigned here) runs R8, so shrinker problems show
      # up on every push rather than only when tagging.
      - name: Assemble debug + release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Exported components
        run: |
          manifest=$(find app/build/intermediates -path '*merged_manifest*' -path '*debug*' -name AndroidManifest.xml | head -n 1)
          test -n "$manifest" || { echo "merged manifest not found"; find app/build/intermediates -name AndroidManifest.xml; exit 1; }
          echo "checking $manifest"
          python3 tools/check_exported_components.py "$manifest" config/exported-components.txt

      - name: Debug APK signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/certs.txt"
          grep -q 'CN=Android Debug' "$RUNNER_TEMP/certs.txt"

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nekopost-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  lint:
    name: Lint
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: Android lint
        run: ./gradlew lintDebug --stacktrace
      - name: Upload lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: android/*/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  # Signed release from a tag app-vX.Y.Z. Repo-level secrets (GitHub Free has
  # no Environments) are only referenced here; no cache is read or written.
  release:
    name: Signed release
    if: ${{ startsWith(github.ref, 'refs/tags/app-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Check tag matches android/VERSION
        run: |
          tag="${GITHUB_REF_NAME#app-v}"
          version=$(tr -d '[:space:]' < VERSION)
          [ "$tag" = "$version" ] || { echo "::error::tag $GITHUB_REF_NAME does not match android/VERSION ($version)"; exit 1; }

      - name: Build signed release
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          NEKOPOST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEKOPOST_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEKOPOST_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64" || { echo "::error::ANDROID_KEYSTORE_B64 is not set"; exit 1; }
          export NEKOPOST_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$NEKOPOST_KEYSTORE_FILE"' EXIT
          (umask 077 && printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$NEKOPOST_KEYSTORE_FILE")
          ./gradlew --no-build-cache :app:assembleRelease --stacktrace

      - name: Verify signature and checksum
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --verbose --print-certs "$apk"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$apk" "$RUNNER_TEMP/out/nekopost-$GITHUB_REF_NAME.apk"
          (cd "$RUNNER_TEMP/out" && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS)

      - name: Upload release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nekopost-release-apk
          path: ${{ runner.temp }}/out/

      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Nekopost Android $GITHUB_REF_NAME" \
            --notes "Android app $GITHUB_REF_NAME. Verify the APK against SHA256SUMS before installing." \
            "$RUNNER_TEMP"/out/*
